<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <!-- Low frequency for broad paper waves/creases -->
    <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="4" result="waves" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.5 0" in="waves" result="grayWaves" />
    
    <!-- High frequency for paper grain -->
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="grain" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.3 0" in="grain" result="grayGrain" />
    
    <!-- Combine them -->
    <feBlend mode="multiply" in="grayWaves" in2="grayGrain" result="combinedNoise" />
  </filter>
  <rect width="100%" height="100%" filter="url(#paper)" />
</svg>
