<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="scroll-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3cca3"/>
      <stop offset="50%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#d4b47e"/>
    </linearGradient>
    <linearGradient id="roll-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a68449"/>
      <stop offset="30%" stop-color="#e3cca3"/>
      <stop offset="70%" stop-color="#c9aa70"/>
      <stop offset="100%" stop-color="#735422"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-shadow">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="15" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Main Body Drop Shadow -->
  <path d="M 80 80 Q 250 50 400 60 T 720 80 L 730 520 Q 550 540 400 530 T 70 520 Z" fill="rgba(0,0,0,0.15)" filter="url(#shadow)"/>

  <!-- Main Body -->
  <path d="M 80 80 Q 250 50 400 60 T 720 80 L 730 520 Q 550 540 400 530 T 70 520 Z" fill="url(#scroll-grad)" stroke="#a68449" stroke-width="1.5" filter="url(#inner-shadow)"/>

  <!-- Top Left Roll -->
  <path d="M 80 80 C 40 70 30 110 50 130 C 70 150 110 140 120 110 C 130 80 100 50 80 80" fill="url(#roll-grad)" stroke="#6b4c1a" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 80 80 C 60 75 50 95 65 110 C 80 125 105 115 110 95" fill="none" stroke="#6b4c1a" stroke-width="1.5"/>

  <!-- Top Right Roll -->
  <path d="M 720 80 C 760 70 770 110 750 130 C 730 150 690 140 680 110 C 670 80 700 50 720 80" fill="url(#roll-grad)" stroke="#6b4c1a" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 720 80 C 740 75 750 95 735 110 C 720 125 695 115 690 95" fill="none" stroke="#6b4c1a" stroke-width="1.5"/>

  <!-- Bottom Left Roll -->
  <path d="M 70 520 C 30 530 20 490 40 470 C 60 450 100 460 110 490 C 120 520 90 550 70 520" fill="url(#roll-grad)" stroke="#6b4c1a" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 70 520 C 50 525 40 505 55 490 C 70 475 95 485 100 505" fill="none" stroke="#6b4c1a" stroke-width="1.5"/>

  <!-- Bottom Right Roll -->
  <path d="M 730 520 C 770 530 780 490 760 470 C 740 450 700 460 690 490 C 680 520 710 550 730 520" fill="url(#roll-grad)" stroke="#6b4c1a" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 730 520 C 750 525 760 505 745 490 C 730 475 705 485 700 505" fill="none" stroke="#6b4c1a" stroke-width="1.5"/>

</svg>
